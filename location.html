<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Localisation · Nous Deux</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.7.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="location.css?v=3" />
</head>
<body>
  <main class="map-screen">
    <div id="liveMap" class="live-map" aria-label="Carte de localisation en direct"></div>

    <header class="map-header">
      <a class="round-action back" href="index.html" aria-label="Retour">‹</a>
      <button id="fitBothBtn" class="couple-pill" type="button" aria-label="Voir JB et Manon">
        <span class="mini-avatar me" id="mapMeAvatar">J</span>
        <span class="mini-avatar partner" id="mapPartnerAvatar">M</span>
        <span class="couple-copy"><strong>Nous deux</strong><small id="mapSubtitle">Dernières positions connues</small></span>
      </button>
      <span id="liveBadge" class="live-badge off">En pause</span>
    </header>

    <div class="map-controls" aria-label="Contrôles de carte">
      <button id="focusMeBtn" class="round-action" type="button" aria-label="Me recentrer">⌖</button>
      <button id="focusPartnerBtn" class="round-action partner-action" type="button" aria-label="Voir Manon">M</button>
    </div>

    <section class="bottom-sheet" aria-label="Informations de localisation">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div>
          <span class="eyebrow">LOCALISATION EN DIRECT</span>
          <h1>JB &amp; Manon</h1>
        </div>
        <label class="location-switch" aria-label="Partager ma position">
          <input id="sharingToggle" type="checkbox" />
          <span></span>
        </label>
      </div>

      <div id="locationMessage" class="location-message" role="status" aria-live="polite"></div>

      <div class="people-row">
        <button id="meMapLink" class="person-card hidden" type="button">
          <span class="person-avatar me" id="meAvatar">J</span>
          <span class="person-copy"><strong id="meName">JB</strong><small>Ma position</small><b id="meStatus">Aucune position</b><em id="meMeta"></em></span>
        </button>

        <button id="partnerMapLink" class="person-card hidden" type="button">
          <span class="person-avatar partner" id="partnerAvatar">M</span>
          <span class="person-copy"><strong id="partnerName">Manon</strong><small>Dernière position connue</small><b id="partnerStatus">Aucune position</b><em id="partnerMeta"></em></span>
        </button>
      </div>

      <div class="quick-actions">
        <button class="primary" id="centerOnMeBtn" type="button">Actualiser ma position</button>
        <button class="secondary" id="refreshLocationBtn" type="button">Actualiser la carte</button>
      </div>

      <div class="place-strip" aria-label="Lieux favoris">
        <span class="place-chip">⌂ Maison</span>
        <span class="place-chip">★ Favoris</span>
        <span class="place-chip muted">Zones &amp; alertes bientôt</span>
      </div>

      <p class="privacy-note">Partage volontaire et visible. Tu peux le couper à tout moment.</p>
    </section>
  </main>

  <script src="config.js"></script>
  <script type="module" src="location.js?v=3"></script>
</body>
</html>
