<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Localisation · Nous Deux</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynqzLO6n5RlnBsZJ7s2nQOVHl8tQ=" crossorigin="" />
  <link rel="stylesheet" href="location.css?v=6" />
</head>
<body>
  <main class="life-screen">
    <section id="map" class="life-map" aria-label="Carte de localisation de JB et Manon"></section>

    <div class="top-ui">
      <button id="settingsBtn" class="round-fab settings-fab" type="button" aria-label="Réglages"><span class="gear">⚙</span><i class="notif-dot"></i></button>
      <button id="familyBtn" class="family-pill" type="button" aria-label="Famille Ridau"><span>Famille Ridau</span><b>▾</b></button>
      <button id="inboxBtn" class="round-fab inbox-fab" type="button" aria-label="Messages"><span>✉</span><i class="count-badge">1</i></button>
      <button id="chatBtn" class="round-fab chat-fab" type="button" aria-label="Discussion">•••</button>
    </div>

    <div class="right-tools">
      <button id="centerOnMeBtn" class="map-circle target-btn" type="button" aria-label="Se localiser">◎</button>
      <button id="layersBtn" class="map-circle layers-btn" type="button" aria-label="Couches de carte">▱</button>
    </div>

    <section id="partnerBubble" class="arrival-card hidden" aria-live="polite">
      <div class="arrival-title"><span>🏡</span><strong id="partnerEventText">Manon est arrivé(e)</strong></div>
      <div id="partnerEventTime" class="arrival-time">À l’instant</div>
    </section>

    <div id="locationMessage" class="toast-message" role="status" aria-live="polite"></div>

    <div class="action-pills">
      <button id="locatePill" class="white-pill" type="button"><span class="purple-icon">◆</span>Se localiser</button>
      <button id="sosBtn" class="white-pill" type="button"><span class="purple-icon">◉</span>Configurer le SOS</button>
    </div>

    <section class="bottom-card">
      <div class="sheet-handle"></div>
      <div class="status-card">
        <div class="status-title">JB & Manon</div>
        <div class="status-line"><span id="liveBadge" class="live-dot">●</span><span id="statusSummary">Localisation privée à deux</span></div>
        <div class="status-actions"><label class="share-switch"><input id="sharingToggle" type="checkbox" /><span></span></label><span id="shareLabel">Partage désactivé</span></div>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Navigation localisation">
      <button class="nav-item active" id="navLocation" type="button"><span class="nav-icon">⌖</span><strong>Localisation</strong></button>
      <button class="nav-item" id="navDrive" type="button"><span class="nav-icon">▣</span><strong>Au volant</strong></button>
      <button class="nav-item" id="navSafety" type="button"><span class="nav-icon">◇</span><strong>Sécurité</strong></button>
      <button class="nav-item" id="navAccount" type="button"><span class="nav-icon">☆</span><strong>Abonnement</strong></button>
    </nav>

    <div class="hidden-compat" aria-hidden="true">
      <button id="refreshLocationBtn" type="button"></button><button id="focusMeBtn" type="button"></button><button id="focusPartnerBtn" type="button"></button><button id="fitBothBtn" type="button"></button><button id="placesBtn" type="button"></button><button id="historyBtn" type="button"></button><button id="meMapLink" type="button"></button><button id="partnerMapLink" type="button"></button>
      <span id="distanceChip"></span><span id="mapSubtitle"></span><span id="meName">JB</span><span id="partnerName">Manon</span><span id="meAvatar">J</span><span id="partnerAvatar">M</span><span id="meMiniAvatar">J</span><span id="partnerMiniAvatar">M</span><span id="meStatus"></span><span id="partnerStatus"></span><span id="meMeta"></span><span id="partnerMeta"></span><div id="meCard"></div><div id="partnerCard"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9coqIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="location.js?v=6"></script>
</body>
</html>
