name: Android Debug Build

on:
  push:
    branches:
      - mobile/capacitor
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'native/android/**'
      - 'index.html'
      - 'app.js'
      - 'app.css'
      - 'config.js'
      - 'location.*'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_DEBUG_CERT_SHA256: 7658e3ee8add1c498be7cffe25d23d11b5f83d3aa480c4da57c171cefc77a7bb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore persistent Android debug keystore
        id: debug-keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nous-deux-android-debug-keystore-v1

      - name: Create Android debug keystore once
        if: steps.debug-keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify persistent signing key identity
        run: |
          ACTUAL_CERT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Keystore certificate SHA-256: $ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_DEBUG_CERT_SHA256"

      - name: Install pinned dependencies
        run: npm install --ignore-scripts

      - name: Stage web application
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native Android bridge
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK signer matches persistent key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          APK_CERT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          echo "APK certificate SHA-256: $APK_CERT"
          test "$APK_CERT" = "$EXPECTED_DEBUG_CERT_SHA256"

      - name: Prepare branded APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NOUS-DEUX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOUS-DEUX-android
          path: NOUS-DEUX.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14
