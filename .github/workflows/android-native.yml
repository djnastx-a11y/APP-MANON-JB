name: Android Native APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/native-android-tracking]
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'
  pull_request:
    paths:
      - 'native-android/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable Android signing key
        run: base64 -d native-android/app/nous-deux-dev.keystore.b64 > native-android/app/nous-deux-dev.keystore
      - name: Build signed debug APK
        working-directory: native-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nous-deux-android-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
